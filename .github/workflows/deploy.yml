name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Set Vercel env var and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ONEDRIVE_SHARE_URL: ${{ secrets.ONEDRIVE_SHARE_URL }}
        run: |
          vercel env rm ONEDRIVE_SHARE_URL production --token=$VERCEL_TOKEN --yes 2>/dev/null || true
          echo "$ONEDRIVE_SHARE_URL" | vercel env add ONEDRIVE_SHARE_URL production --token=$VERCEL_TOKEN
          vercel deploy --prod --token=$VERCEL_TOKEN --yes --name=ebay-xlsm-viewer
